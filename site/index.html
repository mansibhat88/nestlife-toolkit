<style>

.checkrow{display:flex;gap:8px;align-items:center;font-size:14px}

.photo-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.photo-in img{width:64px;height:64px;border-radius:10px;object-fit:cover}

.themes{display:flex;gap:10px;flex-wrap:wrap}
.themes button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}

.set{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

.chart-print table{width:100%;border-collapse:collapse;margin-bottom:20px}.chart-print td,.chart-print th{border:1px solid #999;padding:10px;text-align:center}.chart-print td:first-child{text-align:left}
body{zoom:var(--z,1)}
#side{height:calc(100vh / var(--z,1))}
[data-density=compact] .card{padding:10px}[data-density=compact] .item{padding:8px 10px}[data-density=compact] .grid,[data-density=compact] .grid2,[data-density=compact] .list{gap:8px}[data-density=compact] .ag{padding:5px 0}[data-density=compact] .stat{padding:8px 12px}[data-density=compact] .nav{padding:5px 10px}[data-density=compact] body{line-height:1.35}

.prio{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.prio:last-child{border-bottom:0}

<div id="app">
  <aside id="side"></aside>
  <main>
    <header id="top">
      <button class="icon show-m" data-act="menu" aria-label="Menu">☰</button>
      <div id="title">Today</div>
      <input id="q" type="search" placeholder="Search everything…" aria-label="Search" autocomplete="off">
      <button class="btn pri hide-m" data-act="quick">＋ Quick add</button>
      <span id="status" class="hide-m"></span>
    </header>
    <section id="view"></section>
  </main>
  <nav id="tabs"></nav>
</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* ================= CONFIG (edit these to rebrand / build a demo) ================= */
const CONFIG = {
  appName: 'Nestlife',
  tagline: 'Family & Life Planner',
  version: '1.0.0',
  demo: true,                       // true = sample family, nothing is saved. Set to false to use it for real.
};

/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const z2 = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate());
const todayISO = () => iso(new Date());
const parseD = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const TODAY = () => parseD(todayISO());
const isTouch = matchMedia('(pointer:coarse)').matches;
function money(n) { try { return new Intl.NumberFormat(undefined, {style:'currency', currency:S.settings.currency || 'USD', maximumFractionDigits: Math.abs(n) >= 1000 ? 0 : 2}).format(+n || 0); } catch { return (+n || 0).toFixed(2); } }
function fmtDate(s, opts = {weekday:'short', month:'short', day:'numeric'}) { const d = parseD(s); return d ? d.toLocaleDateString(undefined, opts) : ''; }
function relDate(s) {
  const d = parseD(s); if (!d) return ''; const diff = Math.round((d - TODAY()) / 864e5);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow'; if (diff === -1) return 'Yesterday';
  return fmtDate(s, Math.abs(diff) > 180 ? {month:'short', day:'numeric', year:'numeric'} : undefined);
}
function fmtTime(t) { if (!t) return ''; const [h, m] = t.split(':').map(Number); const d = new Date(); d.setHours(h, m); return d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'}); }
function daysUntil(s) { return Math.round((parseD(s) - TODAY()) / 864e5); }
function ageOf(b) { const d = parseD(b); if (!d) return ''; const t = TODAY(); let a = t.getFullYear() - d.getFullYear(); if (t.getMonth() < d.getMonth() || (t.getMonth() === d.getMonth() && t.getDate() < d.getDate())) a--; return a; }

/* ================= recurrence ================= */
const REPEATS = [['none','Does not repeat'],['daily','Every day'],['weekdays','Weekdays'],['weekly','Every week'],['biweekly','Every 2 weeks'],['monthly','Every month'],['quarterly','Every 3 months'],['biannual','Every 6 months'],['yearly','Every year']];
const REP_LABEL = Object.fromEntries(REPEATS);
function step(d0, rep, k) {
  const x = new Date(d0);
  switch (rep) {
    case 'daily': x.setDate(x.getDate() + k); break;
    case 'weekly': x.setDate(x.getDate() + 7 * k); break;
    case 'biweekly': x.setDate(x.getDate() + 14 * k); break;
    case 'monthly': { const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + k); x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); break; }
    case 'quarterly': return step(d0, 'monthly', 3 * k);
    case 'biannual': return step(d0, 'monthly', 6 * k);
    case 'yearly': return step(d0, 'monthly', 12 * k);
  }
  return x;
}
function occur(ds, rep, a, b) {
  const d0 = parseD(ds); if (!d0) return [];
  if (!rep || rep === 'none') return d0 >= a && d0 <= b ? [d0] : [];
  const out = [];
  if (rep === 'weekdays') { let d = d0 > a ? new Date(d0) : new Date(a); for (; d <= b; d = addDays(d, 1)) if (d.getDay() % 6) out.push(new Date(d)); return out; }
  let i = 0;
  if (rep === 'daily' && a > d0) i = Math.floor((a - d0) / 864e5) - 1;
  if (rep === 'weekly' && a > d0) i = Math.floor((a - d0) / (7 * 864e5)) - 1;
  i = Math.max(0, i);
  for (let n = 0; n < 4000; n++, i++) { const d = step(d0, rep, i); if (d > b) break; if (d >= a) out.push(d); }
  return out;
}
function nextAfter(ds, rep, after) { // first occurrence strictly after date `after`
  if (rep === 'weekdays') { let d = addDays(after, 1); while (!(d.getDay() % 6)) d = addDays(d, 1); return d; }
  const d0 = parseD(ds); let i = 1, d = step(d0, rep, i);
  while (d <= after && i < 5000) d = step(d0, rep, ++i);
  return d;
}

const DB = {
  db: null,
  open() { return new Promise((res, rej) => { const r = indexedDB.open('nestlife', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  get(k) { return new Promise((res, rej) => { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  set(k, v) { return new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
};

  if (sec.key === 'notes') return (a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt);

  return (a, b) => (a.title || '').localeCompare(b.title || '');
}

/* ================= agenda engine ================= */
function datedSources() {
  const out = [];
  for (const it of members()) if (it.birthday) out.push({sec:SEC.members, it, d:it.birthday, rep:'yearly', label:`🎂 ${it.title}'s birthday`});
  for (const sec of SECTIONS) {
    if (!sec.date || !sec.fields || sec.key === 'members') continue;
    for (const it of list(sec.key)) {
      const d = it[sec.date]; if (!d) continue;
      const rep = sec.fixedRep || it.repeat || 'none';
      if (sec.done && it.done && rep === 'none') continue;
      out.push({sec, it, d, rep, label:(sec.key === 'birthdays' ? '🎂 ' : '') + titleOf(sec, it)});
    }
  }
  return out;
}
function agenda(a, b, opts = {}) {
  const out = [];
  for (const s of datedSources()) {
    if (s.sec.cal === false && !opts.all) continue;
    for (const d of occur(s.d, s.rep, a, b)) out.push({...s, date:d});
    if (s.it.end && s.sec.key === 'travel') { const st = parseD(s.d), en = parseD(s.it.end); for (let d = addDays(st, 1); d <= en; d = addDays(d, 1)) if (d >= a && d <= b) out.push({...s, date:d, cont:true}); }
  }
  return out.sort((x, y) => x.date - y.date || (x.it.time || '99').localeCompare(y.it.time || '99'));
}
function overdue() {
  const t = todayISO(), out = [];
  for (const sec of SECTIONS) if (sec.done && sec.date) for (const it of list(sec.key)) if (!it.done && it[sec.date] && it[sec.date] < t) out.push({sec, it, d:it[sec.date], label:titleOf(sec, it)});
  return out.sort((a, b) => a.d.localeCompare(b.d));
}
function nextOccISO(ds, rep) { const o = occur(ds, rep, TODAY(), addDays(TODAY(), 800)); return o[0] ? iso(o[0]) : null; }
function agRow(a, showDate) {
  const doneable = a.sec.done && !a.cont;
  return `<div class="ag"><span class="dot" style="background:${colorOf(a.it)}"></span>
    <div class="grow" data-act="edit" data-sec="${a.sec.key}" data-id="${a.it.id}"><b>${esc(a.label)}</b>
    <small>${showDate ? relDate(iso(a.date || parseD(a.d))) + ' · ' : ''}${a.sec.icon} ${esc(a.sec.label)}${a.it.time ? ' · ' + fmtTime(a.it.time) : ''}${a.sec.key === 'bills' && a.it.amount ? ' · ' + money(a.it.amount) : ''}</small></div>
    ${whoChips(a.it)}
    ${doneable ? `<button class="tick" data-act="done" data-sec="${a.sec.key}" data-id="${a.it.id}" title="Done">✓</button>` : ''}</div>`;
}
function toggleDone(sec, it) {
  const rep = it.repeat || 'none', dk = sec.date;
  let completed = false;
  if (!it.done && rep !== 'none' && it[dk]) {
    const due = parseD(it[dk]), t = TODAY();
    const nx = nextAfter(it[dk], rep, due > t ? due : t);
    it.log = (it.log || []).concat(todayISO()).slice(-60);
    it[dk] = iso(nx); completed = true;
    toast(`Done ✓ Next: ${relDate(it[dk])}`);
  } else { it.done = !it.done; completed = it.done; if (it.done) { it.doneAt = todayISO(); toast('Done ✓'); } }
  it.updatedAt = Date.now();
  if (completed && sec.key === 'chores' && it.who && +it.stars) addStars(it.who, +it.stars, it.title);
  if (completed && sec.key === 'bills' && +it.amount) list('budget').push(newItem({title:it.title, kind:'Expense', amount:+it.amount, category:it.category || 'Bills', date:todayISO(), notes:'Logged when bill was marked paid'}));
  commit();
}

VIEWS.calendar = () => {
  const ws = +S.settings.weekStart;
  if (!UI.calMonth) { const t = TODAY(); UI.calMonth = new Date(t.getFullYear(), t.getMonth(), 1); }
  const m = UI.calMonth, first = new Date(m.getFullYear(), m.getMonth(), 1);
  const start = addDays(first, -((first.getDay() - ws + 7) % 7)), end = addDays(start, 41);
  const ag = agenda(start, end), by = {};
  for (const a of ag) (by[iso(a.date)] = by[iso(a.date)] || []).push(a);
  const sel = UI.calSel || todayISO(), dn = [...Array(7)].map((_, i) => new Date(2024, 0, 7 + ws + i).toLocaleDateString(undefined, {weekday:'short'}));
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i), k = iso(d), items = by[k] || [];
    cells += `<div class="d ${d.getMonth() !== m.getMonth() ? 'out' : ''} ${k === todayISO() ? 'today' : ''} ${k === sel ? 'sel' : ''}" data-act="cal-day" data-d="${k}"><div class="n">${d.getDate()}</div>${items.slice(0, 3).map(a => `<div class="pill" style="--c:${colorOf(a.it)}">${esc(a.label)}</div>`).join('')}${items.length > 3 ? `<div class="more">+${items.length - 3}</div>` : ''}</div>`;

function guessAisle(name) { const n = ' ' + name.toLowerCase() + ' '; for (const [a, kw] of AISLE_KW) for (const w of kw.split(' ')) if (w && n.includes(' ' + w + ' ') || (w.length > 4 && n.includes(w))) return a; return 'Other'; }
function parseQty(s) { if (/^\d+\/\d+$/.test(s)) { const [a, b] = s.split('/'); return +a / +b; } const n = parseFloat(s.replace(',', '.')); return isNaN(n) ? null : n; }

const NOTIFIED = new Set();
function checkReminders() {
  if (!S || !S.settings.notify) return;
  const now = new Date(), t = TODAY(), lead = +S.settings.remindMins || 15;
  for (const a of agenda(t, t)) {
    if (!a.it.time) continue; const [h, m] = a.it.time.split(':').map(Number), at = new Date(t); at.setHours(h, m);
    const diff = (at - now) / 60000, key = a.it.id + todayISO() + a.it.time;
    if (diff <= lead && diff > -2 && !NOTIFIED.has(key)) {
      NOTIFIED.add(key);
      try { if (window.Notification && Notification.permission === 'granted') new Notification(a.label, {body:`${fmtTime(a.it.time)} · ${a.sec.label}`, tag:key}); } catch {}
      toast(`⏰ ${a.label} at ${fmtTime(a.it.time)}`);
    }
  }
}

/* ---------- vault (real AES-GCM encryption) ---------- */
const VAULT = {key:null, items:null, timer:null};
const b64 = u8 => { let s = ''; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt, iter = 310000) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
async function vaultPersist() {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, VAULT.key, new TextEncoder().encode(JSON.stringify(VAULT.items)));
  Object.assign(S.vault, {iv:b64(iv), ct:b64(new Uint8Array(ct)), updatedAt:Date.now()}); commit();
}
function armLock() { clearTimeout(VAULT.timer); VAULT.timer = setTimeout(() => { vaultLock(); toast('Vault locked after 5 minutes'); }, 5 * 60e3); }
function vaultLock() { VAULT.key = null; VAULT.items = null; clearTimeout(VAULT.timer); if (route() === 'vault') render(); }

}

function mergeIn(inc) {
  inc = normalize(inc);
  const del = {...S.deleted}; for (const [k, v] of Object.entries(inc.deleted)) del[k] = Math.max(del[k] || 0, v);
  const keys = new Set([...Object.keys(S.items), ...Object.keys(inc.items)]); let added = 0;
  for (const k of keys) {
    const map = new Map((S.items[k] || []).map(i => [i.id, i]));
    for (const it of inc.items[k] || []) { const ex = map.get(it.id); if (!ex) added++; if (!ex || (it.updatedAt || 0) > (ex.updatedAt || 0)) map.set(it.id, it); }
    S.items[k] = [...map.values()].filter(it => !(del[it.id] && del[it.id] >= (it.updatedAt || 0)));
  }
  const sm = new Map(S.stars.map(s => [s.id, s])); for (const s of inc.stars) sm.set(s.id, s); S.stars = [...sm.values()].filter(s => !del[s.id]);
  S.deleted = del;
  for (const [k, w] of Object.entries(inc.weeks || {})) if (!S.weeks[k] || (w.updatedAt || 0) > (S.weeks[k].updatedAt || 0)) S.weeks[k] = w;
  if (inc.vault && (!S.vault || (inc.vault.updatedAt || 0) > (S.vault.updatedAt || 0))) { S.vault = inc.vault; vaultLock(); }
  return added;
}

    window._inc = j.data;
    openModal(`<h2>Import backup from ${esc(new Date(j.exported).toLocaleString())}</h2><p><b>Merge</b> keeps everything on this device and adds or updates from the backup (newest edit wins). Use this to sync between devices.</p><p><b>Replace</b> wipes this device and restores the backup exactly.</p><div class="row end"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="imp-replace">Replace</button><button class="btn pri" data-act="imp-merge">Merge</button></div>`);

}
const RR = {daily:'FREQ=DAILY', weekdays:'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly:'FREQ=WEEKLY', biweekly:'FREQ=WEEKLY;INTERVAL=2', monthly:'FREQ=MONTHLY', quarterly:'FREQ=MONTHLY;INTERVAL=3', biannual:'FREQ=MONTHLY;INTERVAL=6', yearly:'FREQ=YEARLY'};

function exportICS() {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//' + CONFIG.appName + '//Family Planner//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:' + icsEsc(S.settings.familyName)];
  let n = 0;
  for (const s of datedSources()) {
    if (s.sec.cal === false) continue; const it = s.it, d = s.d.replace(/-/g, ''), timed = it.time && s.sec.key !== 'members';
    L.push('BEGIN:VEVENT', `UID:${it.id}${s.sec.key === 'members' ? '-bday' : ''}@${CONFIG.appName.toLowerCase()}`, 'DTSTAMP:' + stamp);
    if (timed) L.push(`DTSTART:${d}T${it.time.replace(':', '')}00`, it.endtime && it.endtime > it.time ? `DTEND:${d}T${it.endtime.replace(':', '')}00` : 'DURATION:PT1H');
    else L.push('DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + iso(addDays(parseD(it.end && it.end >= s.d ? it.end : s.d), 1)).replace(/-/g, ''));
    if (RR[s.rep]) L.push('RRULE:' + RR[s.rep]);
    L.push('SUMMARY:' + icsEsc(s.label), 'DESCRIPTION:' + icsEsc(s.sec.label + (it.notes ? '\n' + it.notes : '')));
    if (timed) L.push('BEGIN:VALARM', 'TRIGGER:-PT30M', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(s.label), 'END:VALARM');
    L.push('END:VEVENT'); n++;
  }
  L.push('END:VCALENDAR');
  download(L.join('\r\n'), `${S.settings.familyName.replace(/[^\w]+/g, '-')}-calendar.ics`, 'text/calendar');
  toast(`${n} items exported – open the file to add them to your calendar`);
}
function exportCSV(key) {
  const sec = SEC[key], cols = sec.fields.filter(f => f.type !== 'photo');
  const cell = (f, v) => f.type === 'members' || f.type === 'member' ? whoIds({who:v}).map(id => memberOf(id)?.title || '').join('; ') : f.type === 'checklist' ? (v || []).map(x => (x.d ? '✓ ' : '') + x.t).join('; ') : f.type === 'recipe' ? (find('recipes', v)?.title || '') : f.type === 'project' ? (find('projects', v)?.title || '') : v ?? '';
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const rows = [cols.map(f => q(f.label)).join(',') + (sec.done ? ',"Done"' : '')].concat(list(key).map(it => cols.map(f => q(cell(f, it[f.k]))).join(',') + (sec.done ? ',' + q(it.done ? 'yes' : '') : '')));
  download('\ufeff' + rows.join('\r\n'), `${key}-${todayISO()}.csv`, 'text/csv');
}

  'chart-print': () => {
    const kids = members().filter(m => m.role === 'Child'), ppl = kids.length ? kids : members(), s = weekStartDate(0), days = [...Array(7)].map((_, i) => addDays(s, i));
    printHTML(`<div class="chart-print">${ppl.map(k => { const ch = list('chores').filter(c => c.who === k.id); return `<h1>⭐ ${esc(k.title)}'s chore chart</h1><p>Week of ${days[0].toLocaleDateString(undefined, {month:'long', day:'numeric'})}</p><table><tr><th>Chore</th>${days.map(x => `<th>${x.toLocaleDateString(undefined, {weekday:'short'})}</th>`).join('')}<th>★</th></tr>${(ch.length ? ch : [{title:''}, {title:''}, {title:''}]).map(c => `<tr><td>${esc(c.title)}</td>${days.map(() => '<td>&nbsp;</td>').join('')}<td>${c.stars || ''}</td></tr>`).join('')}</table>`; }).join('<div style="page-break-after:always"></div>')}</div>`);
  },
  'wk-nav': d => { UI.week = +d.n ? UI.week + +d.n : 0; render(); },
  hab: d => { const h = find('habits', d.id); if (!h) return; h.days = h.days || {}; if (h.days[d.d]) delete h.days[d.d]; else h.days[d.d] = true; h.updatedAt = Date.now(); commit(); },
  report: d => { const h = RG[d.r] && RG[d.r](); if (h) printHTML(h); },
  setv: d => { S.settings[d.k] = isNaN(+d.v) ? d.v : +d.v; commit(); },
  'bud-nav': d => { const [y, m] = UI.budMonth.split('-').map(Number), x = new Date(y, m - 1 + +d.n, 1); UI.budMonth = x.getFullYear() + '-' + z2(x.getMonth() + 1); render(); },
  theme: d => { S.settings.theme = d.t; commit(); },
  mode: d => { S.settings.mode = d.m; commit(); },
  export: exportBackup,
  import: () => $('#importFile').click(),
  'imp-merge': () => { const n = mergeIn(window._inc); closeModal(); commit(); toast(`Merged ✓ ${n} new items added`); },
  'imp-replace': () => { if (!confirm('Replace everything on this device with the backup?')) return; S = normalize(window._inc); vaultLock(); closeModal(); commit(); toast('Backup restored ✓'); },
  ics: exportICS,
  sample: () => { if (members().length && !confirm('Add the sample family to your existing data?')) return; loadSample(); commit(); location.hash = '#/dashboard'; toast('Sample family loaded – edit or delete anything'); },
  erase: () => { if (prompt('This deletes everything in this browser. Type ERASE to confirm.') !== 'ERASE') return; S = blank(); vaultLock(); commit(); toast('All data erased'); },
  'v-lock': vaultLock,
  'v-add': () => vaultForm(),
  'v-edit': d => vaultForm(d.id),
  'v-del': d => { VAULT.items = VAULT.items.filter(v => v.id !== d.id); closeModal(); vaultPersist(); },
  'v-show': d => { const v = VAULT.items.find(x => x.id === d.id), el = $('#s-' + d.id); el.textContent = el.textContent.startsWith('•') ? v.secret : '••••••••'; armLock(); },
  'v-copy': async d => { const v = VAULT.items.find(x => x.id === d.id); try { await navigator.clipboard.writeText(v.secret); toast('Copied'); } catch { toast("Couldn't copy – tap 👁 to reveal"); } armLock(); }
};
const SUBMIT = {
  f: form => {
    const sec = SEC[M.sec], data = readForm(form, sec);
    if (sec.key === 'meals' && !data.recipe && !data.title) return toast('Pick a recipe or type a dish');
    if (M.id) Object.assign(find(sec.key, M.id), data, {updatedAt:Date.now()});
    else if (sec.key === 'grocery') { const g = addGrocery(data); if (g) g.aisle = data.aisle !== 'Produce' ? data.aisle : guessAisle(data.title); }
    else list(sec.key).push(newItem(data));
    closeModal(); commit(); toast('Saved ✓');
  },
  gq: form => { const v = form.q.value.trim(); if (!v) return; for (const part of v.split(/\s*,\s*/)) addGrocery(parseIng(part)); commit(); setTimeout(() => { const i = $('#gq input'); i && i.focus(); }, 0); },
  rd: form => { const r = find('rewards', form.dataset.id), m = new FormData(form).get('m'); if (!m) return; addStars(m, -(+r.cost || 0), 'Redeemed: ' + r.title); closeModal(); commit(); toast(`🎉 ${memberOf(m).title} redeemed “${r.title}”`); },
  vset: async form => { const {p1, p2} = Object.fromEntries(new FormData(form)); if (p1 !== p2) return toast("Passwords don't match"); const salt = crypto.getRandomValues(new Uint8Array(16)); VAULT.key = await deriveKey(p1, salt); VAULT.items = []; S.vault = {salt:b64(salt), iter:310000}; await vaultPersist(); toast('Vault created 🔐'); },
  vunl: async form => {
    const p = new FormData(form).get('p'); toast('Unlocking…');
    try { const key = await deriveKey(p, ub64(S.vault.salt), S.vault.iter); const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:ub64(S.vault.iv)}, key, ub64(S.vault.ct)); VAULT.items = JSON.parse(new TextDecoder().decode(pt)); VAULT.key = key; render(); toast('Unlocked'); }
    catch { toast('Wrong password'); }
  },
  vf: form => { const o = Object.fromEntries(new FormData(form)), id = form.dataset.id; if (id) Object.assign(VAULT.items.find(v => v.id === id), o); else VAULT.items.push({id:uid(), ...o}); closeModal(); vaultPersist(); }
};

document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  const b = e.target.closest('[data-act]'); if (!b) { if (e.target.closest('#side a')) document.body.classList.remove('nav-open'); return; }
  const d = b.dataset, fn = ACT[d.act]; if (!fn) return;
  if (b.tagName !== 'INPUT' && d.act !== 'link') e.preventDefault();
  e.stopPropagation(); fn(d, b, e);
});
document.addEventListener('submit', e => { e.preventDefault(); const fn = SUBMIT[e.target.id]; if (fn) fn(e.target); });
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.set) {
    const k = el.dataset.set, v = el.type === 'checkbox' ? el.checked : (el.type === 'number' || ['weekStart', 'remindMins'].includes(k)) ? +el.value : el.value;
    S.settings[k] = v; if (k === 'customAcc') S.settings.theme = 'custom';
    if (k === 'notify' && v && window.Notification && Notification.permission === 'default') { try { Notification.requestPermission(); } catch {} }
    commit();
  }
  if (el.dataset.wk) {
    const w = wk(el.dataset.off != null ? +el.dataset.off : UI.week), k = el.dataset.wk, i = +el.dataset.i;
    if (k === 'd') w.p[i].d = el.checked; else if (k === 't') w.p[i].t = el.value.trim(); else if (k === 'f') w.focus[el.dataset.k] = el.value; else w[k] = el.value;
    w.updatedAt = Date.now(); if (k === 'd') commit(); else scheduleSave();
  }
  if (el.dataset.photo) { const f = el.files[0]; if (!f) return; try { const url = await resizeImg(f); M.photos[el.dataset.photo] = url; const im = $('#pv-' + el.dataset.photo); im.src = url; im.hidden = false; } catch { toast("Couldn't read that image"); } }
  if (el.id === 'importFile') importFile(el.files[0]);
});
$('#q').addEventListener('input', e => { Q = e.target.value.trim(); render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); $('#q').focus(); } });
window.addEventListener('hashchange', () => { document.body.classList.remove('nav-open'); Q = ''; $('#q').value = ''; render(); window.scrollTo(0, 0); if (route() === 'settings') storageInfo(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => S.settings.mode === 'auto' && applyTheme());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });

/* ================= boot ================= */
(async function boot() {
  let st = null;
  try { await DB.open(); st = await DB.get('state'); } catch (e) { DB.db = null; }
  if (!st) { try { st = JSON.parse(localStorage.getItem('nestlife')); } catch {} }
  S = normalize(st || blank());
  if (CONFIG.demo) { S = normalize(blank()); loadSample(); }
  try { navigator.storage?.persist?.(); } catch {}
  setStatus(CONFIG.demo ? 'Demo – not saved' : 'Saved ✓');
  render(); if (route() === 'settings') storageInfo();
})();
</script>
